[project]
name = "code-review-desk"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "openai-agents>=0.19.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]
runtime = ["chainlit>=2.0", "opentelemetry-api>=1.40", "opentelemetry-sdk>=1.40"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
